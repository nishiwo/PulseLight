<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>PulseLight 80/20 edge rail implementation preview</title>
  <desc>Dark mode product preview showing the collapsed agent and token rail and the expanded PulseLight usage panel.</desc>
  <rect width="1280" height="720" fill="#171629"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#desktop)" opacity=".22"/>

  <!-- Collapsed rail: enlarged for documentation, but keeps the same 80/20 split. -->
  <g transform="translate(128 145)">
    <path d="M0 26C0 11.64 11.64 0 26 0h12v400H26C11.64 400 0 388.36 0 374V26Z" fill="#050505"/>
    <rect x="12" y="14" width="14" height="306" rx="7" fill="#ffbf18"/>
    <rect x="12" y="320" width="14" height="66" rx="7" fill="#00e68a"/>
    <rect x="12" y="318" width="14" height="2" fill="#171629" opacity=".9"/>
    <circle cx="19" cy="74" r="4" fill="#fff" opacity=".9"/>
    <circle cx="19" cy="162" r="4" fill="#fff" opacity=".7"/>
    <circle cx="19" cy="250" r="4" fill="#fff" opacity=".5"/>
  </g>
  <text x="128" y="578" fill="#b8b5c4" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="17">收起 / Collapsed</text>
  <text x="128" y="604" fill="#777486" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="14">上方 80% Agent · 下方 20% Token</text>

  <!-- Expanded state, following the existing Pulse dark panel geometry. -->
  <g transform="translate(390 92)">
    <path d="M34 0h706c18.78 0 34 15.22 34 34v386c0 18.78-15.22 34-34 34H34c-18.78 0-34-15.22-34-34V34C0 15.22 15.22 0 34 0Z" fill="#050505"/>
    <path d="M0 90h774" stroke="#282634"/>
    <circle cx="48" cy="48" r="14" fill="#ffbf18"/>
    <text x="76" y="56" fill="#f5f4f8" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif" font-size="25" font-weight="600">PulseLight</text>
    <text x="76" y="80" fill="#8f8b9c" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="14">Agent running · Token usage</text>

    <!-- Agent status -->
    <circle cx="52" cy="139" r="8" fill="#ffbf18"/>
    <text x="78" y="145" fill="#f2f0f5" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="18">Agent 正在运行</text>
    <text x="78" y="170" fill="#858191" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="14">本地会话活动持续更新</text>

    <!-- Usage rows: compact and deliberately close to the real Pulse card. -->
    <g transform="translate(48 218)">
      <text x="0" y="0" fill="#d8d5df" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="15">5-hour limit · Claude Code</text>
      <text x="620" y="0" fill="#d8d5df" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="15">38% Used</text>
      <rect x="0" y="16" width="620" height="7" rx="3.5" fill="#292731"/>
      <rect x="0" y="16" width="236" height="7" rx="3.5" fill="#00e68a"/>
      <text x="0" y="50" fill="#898595" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="13">Resets in 3h 12m</text>
    </g>
    <g transform="translate(48 302)">
      <text x="0" y="0" fill="#d8d5df" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="15">Weekly limit · Codex</text>
      <text x="620" y="0" fill="#d8d5df" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="15">62% Used</text>
      <rect x="0" y="16" width="620" height="7" rx="3.5" fill="#292731"/>
      <rect x="0" y="16" width="384" height="7" rx="3.5" fill="#ffbf18"/>
      <text x="0" y="50" fill="#898595" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="13">Resets tomorrow 09:40</text>
    </g>
    <g transform="translate(48 386)">
      <text x="0" y="0" fill="#d8d5df" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="15">Monthly limit · Antigravity</text>
      <text x="620" y="0" fill="#d8d5df" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="15">78% Used</text>
      <rect x="0" y="16" width="620" height="7" rx="3.5" fill="#292731"/>
      <rect x="0" y="16" width="484" height="7" rx="3.5" fill="#ff594f"/>
      <text x="0" y="50" fill="#898595" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="13">Resets Sep 12 08:00</text>
    </g>

    <line x1="48" y1="430" x2="726" y2="430" stroke="#282634"/>
    <circle cx="88" cy="460" r="6" fill="#00e68a"/>
    <text x="103" y="465" fill="#9995a4" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="13">刚完成 / Completed</text>
    <circle cx="300" cy="460" r="6" fill="#ffbf18"/>
    <text x="315" y="465" fill="#9995a4" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="13">运行中 / Running</text>
    <circle cx="510" cy="460" r="6" fill="#ff594f"/>
    <text x="525" y="465" fill="#9995a4" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="13">需确认 / Attention</text>
  </g>

  <text x="390" y="600" fill="#b8b5c4" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="17">悬停展开 / Hover to expand</text>
  <text x="390" y="626" fill="#777486" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="14">沿用 Pulse 原有额度卡片，只新增 Agent 状态提示</text>

  <defs>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48405f"/>
      <stop offset="1" stop-color="#11101b"/>
    </linearGradient>
  </defs>
</svg>
